---
name: Build
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ruby/setup-ruby@v1.319.0
        with:
          bundler-cache: true
          ruby-version: "4.0"
      - name: Check code
        run: bundle exec rubocop

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
          run_install: true
      - name: Check code
        run: pnpm lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
          run_install: true
      - name: Check code
        run: pnpm prettier

  minitest:
    name: Minitest
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    strategy:
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  vitest:
    name: Vitest (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
          run_install: true
      - name: Install React ${{ matrix.react }}
        if: matrix.react != '19'
        run: pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - name: Run tests
        run: pnpm test

  automerge:
    name: "Auto-merge Dependabot"
    needs: [rubocop, eslint, prettier, minitest, vitest]
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    needs: [rubocop, eslint, prettier, minitest, vitest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-rubygems:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: rubygems/release-gem@v1

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
          run_install: true
      - name: Build package
        run: pnpm build
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish to npm
        run: npm publish --access public
